name: google-seo-mcp

services:
  google-seo-mcp:
    # Supply a reviewed release as registry/repository@sha256:<digest>.
    image: "${GOOGLE_SEO_IMAGE:?Set the qualified immutable image reference}"
    platform: linux/amd64
    command: ["--transport", "streamable-http"]
    user: "10001:10001"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
    ports:
      # Operator-approved publication; override the bind for narrower ingress.
      - "${GOOGLE_SEO_BIND_ADDRESS:-0.0.0.0}:3006:8000"
    environment:
      GOOGLE_SEO_TRANSPORT: streamable-http
      GOOGLE_SEO_PROFILE: production
      GOOGLE_SEO_AUTH_MODE: service-account
      GOOGLE_SEO_HOST: 0.0.0.0
      GOOGLE_SEO_PORT: "8000"
      GOOGLE_SEO_PUBLIC_BASE_URL: "${GOOGLE_SEO_PUBLIC_BASE_URL:-https://google-seo.mcp.propel.marketing}"
      # Add exact operator-approved LAN/tailnet host:port entries for host smoke.
      # Overrides must retain the loopback:8000 Host used by the healthcheck.
      GOOGLE_SEO_ACCEPTED_HOSTS: "${GOOGLE_SEO_ACCEPTED_HOSTS:-google-seo.mcp.propel.marketing,localhost:8000,127.0.0.1:8000,[::1]:8000,localhost:3006,127.0.0.1:3006,[::1]:3006}"
      GOOGLE_SEO_ACCEPTED_ORIGINS: "${GOOGLE_SEO_ACCEPTED_ORIGINS:-https://google-seo.mcp.propel.marketing}"
      GOOGLE_SEO_CONSUMER_KEYS_FILE: /run/secrets/consumer-keys.json
      GOOGLE_SEO_SERVICE_ACCOUNT_FILE: /run/secrets/google-seo-service-account.json
      GOOGLE_SEO_REQUIRE_GOOGLE_CREDENTIALS: "${GOOGLE_SEO_REQUIRE_GOOGLE_CREDENTIALS:-false}"
      # Paths only; reuse /run/secrets. Absent Bing files are intentional until
      # the runbook HOLD/resume gate; never inject a literal API key here.
      GOOGLE_SEO_BING_CREDENTIALS_FILE: /run/secrets/bing-webmaster.json
      GOOGLE_SEO_BING_SITES_FILE: /run/secrets/bing-sites.json
      GOOGLE_SEO_REQUIRE_BING_CREDENTIALS: "${GOOGLE_SEO_REQUIRE_BING_CREDENTIALS:-false}"
      GSC_ALLOW_DESTRUCTIVE: "false"
      GOOGLE_SEO_ALLOW_INDEXNOW: "false"
      GOOGLE_SEO_ALLOW_LOCAL_FILES: "false"
      GOOGLE_SEO_ALLOW_PRIVATE_FETCH: "false"
      GOOGLE_SEO_DEBUG: "false"
      DATAFORSEO_LOGIN: "${DATAFORSEO_LOGIN:-}"
      DATAFORSEO_PASSWORD: "${DATAFORSEO_PASSWORD:-}"
    volumes:
      # One protected directory; SA file may intentionally be absent. Directory
      # must exist and contain the required hash-only consumer-keys.json file.
      - type: bind
        source: "${GOOGLE_SEO_SECRETS_DIR:?Set the protected secrets directory}"
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3); assert r.status==200"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
